[package]
name = "silly"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/settings"]

[dependencies]
settings = { path = "crates/settings" }
anyhow = "1.0.102"
gpui = "0.2.2"
gpui-component = "0.5.1"
rust-embed = "8.11.0"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc = "0.2"
cocoa = "0.25"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ config.title }}{% endblock %} — {{ config.description }}</title>
  <meta name="description" content="{{ config.description }}" />
  <meta property="og:title" content="{{ config.title }}" />
  <meta property="og:description" content="{{ config.description }}" />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="{{ get_url(path='main.css') }}" />
</head>
<body>

  <nav>
    <a href="{{ config.base_url }}" class="nav-logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
      </svg>
      silly<span>.</span>
    </a>
    <ul class="nav-links">
      <li><a href="#features">Features</a></li>
      <li><a href="#roadmap">Roadmap</a></li>
      <li><a href="#stack">Stack</a></li>
      <li>
        <a href="{{ config.extra.github }}" class="btn btn-ghost" target="_blank" rel="noopener">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.49.5.09.68-.22.68-.48v-1.7c-2.78.61-3.37-1.34-3.37-1.34-.45-1.15-1.11-1.46-1.11-1.46-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.56-1.11-4.56-4.95 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02A9.56 9.56 0 0112 6.8c.85.004 1.7.115 2.5.337 1.9-1.29 2.74-1.02 2.74-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.85-2.34 4.7-4.57 4.95.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10.01 10.01 0 0022 12c0-5.52-4.48-10-10-10z"/>
          </svg>
          GitHub
        </a>
      </li>
    </ul>
  </nav>

  {% block content %}{% endblock %}

  <footer>
    <p>
      Built with ❤️ and Rust &nbsp;·&nbsp;
      <a href="{{ config.extra.github }}" target="_blank" rel="noopener">GitHub</a> &nbsp;·&nbsp;
      <a href="{{ config.extra.gpui }}" target="_blank" rel="noopener">GPUI</a> &nbsp;·&nbsp;
      Built with <a href="https://www.getzola.org" target="_blank" rel="noopener">Zola</a>
    </p>
  </footer>

</body>
</html>
